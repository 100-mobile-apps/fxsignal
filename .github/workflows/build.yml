name: Build Android release

on:
  push:
    branches: ['**']
    paths-ignore: ['backend/**', 'store-assets/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'out-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 requires Gradle 9.3+, which this project doesn't use yet.
          flutter-version: 3.47.9
          cache: true

      - name: Fill in missing platform files (e.g. MainActivity)
        run: |
          flutter create --org com.forexsignalslive --project-name forex_signals --platforms android . > /dev/null
          git status --short

      - name: Signing (real upload key from secrets, else a temporary TEST key)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "FX_RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "FX_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "FX_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "FX_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNING=upload"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/test-only.jks" -alias test -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass testpass -keypass testpass -dname "CN=TEST ONLY - not for Play"
            {
              echo "FX_RELEASE_STORE_FILE=$RUNNER_TEMP/test-only.jks"
              echo "FX_RELEASE_STORE_PASSWORD=testpass"
              echo "FX_RELEASE_KEY_ALIAS=test"
              echo "FX_RELEASE_KEY_PASSWORD=testpass"
              echo "SIGNING=test"
            } >> "$GITHUB_ENV"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build AAB + APK
        timeout-minutes: 35
        run: |
          mkdir -p ../out
          set -o pipefail
          ( flutter build appbundle --release < /dev/null && flutter build apk --release < /dev/null ) 2>&1 | tee ../out/build.log

      - name: Collect outputs
        if: always()
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp build/app/outputs/bundle/release/app-release.aab ../out/forex-signals-$V-$SIGNING.aab 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk ../out/forex-signals-$V-$SIGNING.apk 2>/dev/null || true
          echo "commit ${GITHUB_SHA} signing=$SIGNING" > ../out/INFO.txt
          ls -la ../out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release
          path: out/

      - name: Push outputs to branch out-build
        if: always()
        working-directory: out
        run: |
          git init -q -b out-build
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out-build
